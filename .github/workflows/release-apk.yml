# 推送 v* tag 自动编译 release APK 并发布到 GitHub Release
# 发版: 改 version.properties → 提交 → git tag v<versionName> && git push origin v<versionName>
#
# 流程: 构建 sing-box 内核 libbox.aar + sidecar(mihomo/hev/xray → app/src/full/)
#       (均在 .gitignore 内, CI 从源码重建并按 tag 缓存)
#       → 注入签名(可选 secrets) → assembleSlimRelease + assembleFullRelease
#       (slim 仅 sing-box, full 含 mihomo/Xray; 各按 ABI 分包) → 上传 Release

name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  SINGBOX_TAG: v1.14.0-beta.17
  GOMOBILE_VERSION: v0.1.12
  NDK_VERSION: 28.0.13004108

jobs:
  build:
    name: Build & release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # full history + tags: the release-notes step diffs against the previous tag
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache libbox.aar (sing-box core)
        id: libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ env.SINGBOX_TAG }}

      # app/libs/ 只含 gitignored 的 libbox.aar, checkout 不会创建该目录
      - name: Ensure app/libs exists
        run: mkdir -p app/libs

      - name: Cache sidecar cores (mihomo cmfa + hev + xray)
        uses: actions/cache@v4
        with:
          path: app/src/full/jniLibs
          key: sidecar-v3-full-mihomo-v1.19.30-cmfa-hev-2.17.1-xray-v26.3.27

      # mihomo 官方 android 二进制的 TUN 会读 packages.xml(root-only) fatal,
      # 必须 cmfa 标签自编译; hev 为 TUN→socks5 JNI 桥(ndk-build)
      - name: Build sidecar cores
        run: python tools/fetch_cores.py

      # sing-box v1.14 起移除了 `make lib_android`, 改用 cmd/internal/build_libbox。
      # 该工具(build_shared/sdk.go)固定使用 NDK 28.0.13004108、强制 openjdk 17,
      # 产出 libbox.aar + libbox-legacy.aar(io.nekohasekai.libbox), 只需拷贝前者。
      - name: Build sing-box core (libbox.aar)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: |
          # runner 镜像未把 sdkmanager 加进 PATH, 从 cmdline-tools 目录解析
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under \$ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --install \
            "ndk;${NDK_VERSION}" \
            "platforms;android-24" \
            "platforms;android-21" > /dev/null
          git clone --depth 1 --branch "${SINGBOX_TAG}" https://github.com/SagerNet/sing-box /tmp/sing-box
          cd /tmp/sing-box
          go install github.com/sagernet/gomobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install github.com/sagernet/gomobile/cmd/gobind@${GOMOBILE_VERSION}
          go run ./cmd/internal/build_libbox
          cp libbox.aar "${GITHUB_WORKSPACE}/app/libs/libbox.aar"

      # 签名材料不入库。配置以下 repo secrets 后, CI 产物与本地正式签名一致:
      #   INTERSTELLAR_KEYSTORE_B64     base64(interstellar.jks)
      #   INTERSTELLAR_STORE_PASSWORD   storePassword
      #   INTERSTELLAR_KEY_ALIAS        keyAlias
      #   INTERSTELLAR_KEY_PASSWORD     keyPassword
      # 签名材料来源，优先级：
      #   1. repo secrets（推荐，密钥不进仓库）
      #   2. 仓库内 keystore/signing.properties（可选，零配置就能出正式签名包）
      # 都没有 → app/build.gradle.kts 回退 debug 签名，产物名带 -debugsigned。
      # 千万别让它变成"未签名"：Android 会直接报「安装包未包含任何证书」。
      - name: Restore signing config
        env:
          KEYSTORE_B64: ${{ secrets.INTERSTELLAR_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.INTERSTELLAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INTERSTELLAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INTERSTELLAR_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > interstellar.p12
            {
              echo "storeFile=interstellar.p12"
              echo "storeType=PKCS12"
              echo "storePassword=${STORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "keyPassword=${KEY_PASSWORD}"
            } > signing.properties
            echo "::notice::签名：使用 repo secrets 里的密钥"
            exit 0
          fi
          if [ -f keystore/signing.properties ]; then
            echo "::notice::签名：使用仓库内 keystore/ 的密钥"
            exit 0
          fi
          echo "::warning::没有签名材料，release 将回退 debug 签名（产物名带 -debugsigned，无法覆盖安装）"

      - name: Verify tag matches version.properties
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d ' \r')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} 与 version.properties (versionName=${VERSION}) 不一致, 请先改 version.properties 再打对应 tag"
            exit 1
          fi

      # 两个 flavor 都要编：slim（仅 sing-box）与 full（含 mihomo / Xray）
      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleSlimRelease :app:assembleFullRelease --no-daemon

      # interstellar-<flavor>-<abi>-release.apk → interstellar-<flavor>-<abi>-<tag>.apk
      # 带 flavor 后 APK 落在 app/build/outputs/apk/<flavor>/release/
      - name: Rename APKs with tag
        run: |
          shopt -s nullglob
          for f in app/build/outputs/apk/*/release/interstellar-*.apk; do
            base="${f%.apk}"
            case "$base" in *-"$GITHUB_REF_NAME") continue ;; esac   # 已重命名过
            # -debugsigned 必须留在名字里，否则一个装不上的包看起来跟正常包一样
            sign=""
            case "$base" in *-debugsigned) sign="-debugsigned"; base="${base%-debugsigned}" ;; esac
            mv "$f" "${base%-release}${sign}-${GITHUB_REF_NAME}.apk"
          done
          find app/build/outputs/apk -name '*.apk' | sort

      # 未签名 APK 装到手机上会直接报「安装包未包含任何证书」，绝不能让这种包流出去。
      # 注意 v2/v3 签名的 APK 里**没有** META-INF/*.RSA，所以两种都要查。
      - name: Verify APK signatures
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          def signed(path):
              with open(path, "rb") as f:
                  blob = f.read()
              if b"APK Sig Block 42" in blob:
                  return "v2/v3"
              with zipfile.ZipFile(path) as z:
                  for n in z.namelist():
                      u = n.upper()
                      if u.startswith("META-INF/") and u.endswith((".RSA", ".DSA", ".EC", ".SF")):
                          return "v1"
              return None

          apks = sorted(glob.glob("app/build/outputs/apk/**/*.apk", recursive=True))
          if not apks:
              print("::error::没有找到任何 APK")
              sys.exit(1)
          bad, soft = [], []
          for p in apks:
              kind = signed(p)
              print(f"{'OK ' if kind else 'BAD'} {kind or 'UNSIGNED':<7} {p}")
              if not kind:
                  bad.append(p)
              elif "-debugsigned" in p:
                  soft.append(p)
          if bad:
              print(f"::error::{len(bad)} 个 APK 未签名，Android 会拒绝安装")
              sys.exit(1)
          if soft:
              print(f"::warning::{len(soft)} 个 APK 用的是 debug 签名，无法覆盖安装升级")
          PY

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interstellar-${{ github.ref_name }}
          path: app/build/outputs/apk/**/*.apk

      # 更新摘要 = "版本提交"(范围内最后改 version.properties 的那个)的完整
      # message(标题+正文), 再附自上一 tag 以来的其余提交。按 version.properties
      # 定位而不是 tag 落点 —— tag 可能落在版本提交之后的杂项提交上(如 v0.5.3)。
      - name: Generate release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          RANGE="${PREV_TAG:+${PREV_TAG}..}${TAG}"
          SUMMARY_COMMIT=$(git log --format=%H -1 "$RANGE" -- version.properties 2>/dev/null || true)
          [ -n "$SUMMARY_COMMIT" ] || SUMMARY_COMMIT="$TAG"
          EXCL=$(git rev-parse --short "$SUMMARY_COMMIT")
          {
            echo "## 更新摘要"
            echo
            git log -1 --format='%B' "$SUMMARY_COMMIT"
            RANGE_LOG=$(git log --no-merges --format='%h|%s' "$RANGE" 2>/dev/null \
              | grep -v "^${EXCL}|" | sed -e 's/^/- /' -e 's/|/ /' || true)
            if [ -n "$RANGE_LOG" ]; then
              echo
              echo "## 自 ${PREV_TAG:-起始} 以来的全部提交"
              echo
              echo "$RANGE_LOG"
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/**/*.apk
          body_path: release_notes.md
          fail_on_unmatched_files: true
