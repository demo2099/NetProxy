# 编译 APK 并发布到 GitHub Releases（不需要打 tag）。
# 按 version.properties 的 versionName 建 tag（如 v0.5.3）并把产物传到对应 Release。
# push 到 main 和手动触发都会发版（手动触发可用 publish 输入关掉）。
# tag 跟着版本号走，所以重复构建只会覆盖同一个 Release 的 APK，不会每次提交刷一个新 Release。
#
# 每次构建出两套产物（Gradle product flavor，见 app/build.gradle.kts 的 flavorDimensions "cores"）：
#   slim = 仅 sing-box 内核，体积最小
#   full = 另含 mihomo / Xray sidecar，可在 App 内「内核」处切换
# 每套都按 ABI 分包（armeabi-v7a / arm64-v8a / x86 / x86_64 + universal）。
#
# 背景：内核二进制不入库（.gitignore），CI 内重建并缓存：
#   app/libs/libbox.aar       sing-box 内核（cmd/internal/build_libbox）
#   app/src/full/jniLibs/     mihomo / hev / xray sidecar（tools/fetch_cores.py）
# sidecar 放在 app/src/full/ 这个 flavor source set 下，所以 slim 天然不会打进它们。

name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
          - both
      publish:
        description: '是否发布到 GitHub Releases'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      tag:
        description: '自定义 Release tag（留空 = v<versionName>）'
        required: false
        default: ''
        type: string
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  SINGBOX_TAG: v1.14.0-beta.17
  GOMOBILE_VERSION: v0.1.12
  NDK_VERSION: 28.0.13004108

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # NDK 供 sing-box 内核构建（build_libbox 固定用 28.0.13004108）与 sidecar（mihomo 非 arm64 ABI + hev）共用
      - name: Install Android NDK & platforms
        run: |
          SDKMANAGER="$(ls -d "${ANDROID_HOME}"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under \$ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --install \
            "ndk;${NDK_VERSION}" \
            "platforms;android-36" \
            "platforms;android-24" \
            "platforms;android-21" > /dev/null
          {
            echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}"
            echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}"
          } >> "$GITHUB_ENV"

      # app/libs/ 只含 gitignored 的 libbox.aar，checkout 不会创建该目录
      - name: Ensure app/libs exists
        run: mkdir -p app/libs

      - name: Cache libbox.aar (sing-box core)
        id: libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ env.SINGBOX_TAG }}

      # sing-box v1.14 起移除 `make lib_android`，改用 cmd/internal/build_libbox。
      # 该工具固定用 NDK 28.0.13004108、强制 openjdk 17，产出 libbox.aar。
      - name: Build sing-box core (libbox.aar)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${SINGBOX_TAG}" https://github.com/SagerNet/sing-box /tmp/sing-box
          cd /tmp/sing-box
          go install github.com/sagernet/gomobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install github.com/sagernet/gomobile/cmd/gobind@${GOMOBILE_VERSION}
          go run ./cmd/internal/build_libbox
          cp libbox.aar "${GITHUB_WORKSPACE}/app/libs/libbox.aar"

      # sidecar 只影响 full flavor；缓存路径是 flavor source set（不是 app/src/main）
      - name: Cache sidecar cores (mihomo cmfa + hev + xray)
        uses: actions/cache@v4
        with:
          path: app/src/full/jniLibs
          key: sidecar-v3-full-mihomo-v1.19.30-cmfa-hev-2.17.1-xray-v26.3.27

      # mihomo 官方 android 二进制会读 packages.xml(root-only) fatal，必须 cmfa 标签自编译；
      # hev 为 TUN→socks5 JNI 桥(ndk-build)；xray 走官方 release 下载。
      # 产物落进 app/src/full/，所以 slim flavor 不含它们。
      - name: Build sidecar cores (mihomo / hev / xray)
        run: python tools/fetch_cores.py

      # 签名材料来源，优先级：
      #   1. repo secrets（推荐，密钥不进仓库）
      #   2. 仓库内 keystore/signing.properties（可选，零配置就能出正式签名包）
      # 都没有 → app/build.gradle.kts 回退 debug 签名，产物名带 -debugsigned。
      # 千万别让它变成"未签名"：Android 会直接报「安装包未包含任何证书」。
      - name: Restore signing config (optional)
        env:
          KEYSTORE_B64: ${{ secrets.INTERSTELLAR_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.INTERSTELLAR_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.INTERSTELLAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.INTERSTELLAR_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > interstellar.p12
            {
              echo "storeFile=interstellar.p12"
              echo "storeType=PKCS12"
              echo "storePassword=${STORE_PASSWORD}"
              echo "keyAlias=${KEY_ALIAS}"
              echo "keyPassword=${KEY_PASSWORD}"
            } > signing.properties
            echo "::notice::签名：使用 repo secrets 里的密钥"
            exit 0
          fi
          if [ -f keystore/signing.properties ]; then
            echo "::notice::签名：使用仓库内 keystore/ 的密钥"
            exit 0
          fi
          echo "::warning::没有签名材料，release 将回退 debug 签名（产物名带 -debugsigned，无法覆盖安装）"

      - name: Resolve release tag
        id: ver
        run: |
          VERSION=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d ' \r')
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "resolved tag=${TAG} (versionName=${VERSION})"

      # 两个 flavor 都要编：slim（仅 sing-box）与 full（含 mihomo / Xray）
      - name: Build APK
        run: |
          chmod +x gradlew
          BT="${{ github.event.inputs.build_type || 'release' }}"
          case "$BT" in
            debug)   TASKS=":app:assembleSlimDebug :app:assembleFullDebug" ;;
            both)    TASKS=":app:assembleSlimDebug :app:assembleFullDebug :app:assembleSlimRelease :app:assembleFullRelease" ;;
            *)       TASKS=":app:assembleSlimRelease :app:assembleFullRelease" ;;
          esac
          echo "build_type=${BT}  tasks=${TASKS}"
          ./gradlew $TASKS --no-daemon

      # 未签名 APK 装到手机上会直接报「安装包未包含任何证书」，绝不能让这种包流出去。
      # 注意 v2/v3 签名的 APK 里**没有** META-INF/*.RSA，所以两种都要查。
      - name: Verify APK signatures
        run: |
          python - <<'PY'
          import glob, sys, zipfile

          def signed(path):
              with open(path, "rb") as f:
                  blob = f.read()
              # v2/v3 签名块夹在条目数据与 Central Directory 之间
              if b"APK Sig Block 42" in blob:
                  return "v2/v3"
              with zipfile.ZipFile(path) as z:
                  for n in z.namelist():
                      u = n.upper()
                      if u.startswith("META-INF/") and u.endswith((".RSA", ".DSA", ".EC", ".SF")):
                          return "v1"
              return None

          apks = sorted(glob.glob("app/build/outputs/apk/**/*.apk", recursive=True))
          if not apks:
              print("::error::没有找到任何 APK")
              sys.exit(1)
          bad, soft = [], []
          for p in apks:
              kind = signed(p)
              print(f"{'OK ' if kind else 'BAD'} {kind or 'UNSIGNED':<7} {p}")
              if not kind:
                  bad.append(p)
              elif "-debugsigned" in p:
                  soft.append(p)
          if bad:
              print(f"::error::{len(bad)} 个 APK 未签名，Android 会拒绝安装")
              sys.exit(1)
          if soft:
              print(f"::warning::{len(soft)} 个 APK 用的是 debug 签名，无法覆盖安装升级")
          PY

      - name: Generate release notes
        run: |
          cat > release_notes.md <<'EOF'
          ## 下载哪个？

          每次构建出**两套**产物，每套都含全部 CPU 架构：

          | 套件 | 内核 | 说明 |
          |---|---|---|
          | `slim` | 仅 sing-box | 体积最小，够用就选它 |
          | `full` | sing-box + mihomo + Xray | 可在 App 内「内核」处切换 |

          ## 按手机 CPU 架构选 APK

          | 文件名里的 ABI | 适用设备 |
          |---|---|
          | `arm64-v8a` | 2017 年之后的绝大多数手机 —— **一般选这个** |
          | `armeabi-v7a` | 老款 32 位手机 |
          | `x86_64` / `x86` | 模拟器（BlueStacks / WSA） |
          | `universal` | 不确定架构时用，一个包内含全部架构 |

          ## 安装 / 升级

          - **正式签名包**：可以直接**覆盖安装**升级，不需要卸载旧版。
          - 文件名带 `-debugsigned`：这次构建没有签名密钥，签名会随构建机变化，
            升级前必须先卸载旧版。
          - 安装时提示「安装包未包含任何证书」= 拿到了未签名的包，换个正式签名的版本。
          - 如果提示「签名不一致」，说明手机上装的旧版是另一个密钥签的，卸载一次即可，
            之后所有正式签名包都能互相覆盖。
          EOF
          echo "构建类型：\`${{ github.event.inputs.build_type || 'release' }}\`" >> release_notes.md
          cat release_notes.md

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: interstellar-apk-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # push 到 main 也会发版；手动触发时受 publish 输入控制（默认 true）。
      # tag 取自 version.properties 的 versionName，所以重复运行只会覆盖同一个
      # Release 的 APK。想改成"只有手动触发才发版"，把下面的 if 换成：
      #   github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
      - name: Publish to GitHub Releases
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 星际穿越 ${{ steps.ver.outputs.tag }}
          body_path: release_notes.md
          files: app/build/outputs/apk/**/*.apk
          fail_on_unmatched_files: true
          make_latest: ${{ github.event.inputs.build_type != 'debug' }}
